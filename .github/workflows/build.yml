name: Build Donuts

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Libs directory
        run: |
          if [ ! -d "Libs" ] || [ -z "$(ls -A Libs/*.dll 2>/dev/null)" ]; then
            echo "ERROR: Libs/ directory is empty or missing."
            echo "Run setup-libs.ps1 locally and commit the DLLs, or upload them."
            exit 1
          fi
          echo "Found $(ls Libs/*.dll | wc -l) reference DLLs in Libs/"

      - name: Restore packages
        run: dotnet restore Donuts.csproj

      - name: Build
        run: dotnet build Donuts.csproj -c Release --no-restore

      - name: Verify standalone runtime references
        run: dotnet run --project Tools/AssemblyReferenceCheck/AssemblyReferenceCheck.csproj --configuration Release -- bin/Release/netstandard2.1/Donuts.dll

      - name: Package mod
        run: |
          mkdir -p artifact/Donuts
          cp bin/Release/netstandard2.1/Donuts.dll artifact/Donuts/
          cp ScenarioConfig.json artifact/Donuts/
          cp RandomScenarioConfig.json artifact/Donuts/
          cp -r Patterns artifact/Donuts/patterns
          cp -r zoneSpawnPoints artifact/Donuts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Donuts
          path: artifact/Donuts/
